name: PostStreak
options:
  bundleIdPrefix: com.rosstoma
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: FMQ2H9F8WV
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  PostStreak:
    type: application
    platform: iOS
    sources:
      - path: PostStreak
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rosstoma.PostStreak
        CODE_SIGN_ENTITLEMENTS: PostStreak/PostStreak.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: PostStreak/Info.plist
    dependencies:
      - target: PostStreakShare
        embed: true
  PostStreakShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rosstoma.PostStreak.Share
        PRODUCT_NAME: PostStreakShare
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ShareExtension/Info.plist
